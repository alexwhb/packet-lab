 color: #ECECEC; font-family: Inter, system-ui, sans-serif; font-size: 14px; line-height: 1.5\" data-canvas-width=\"1440\" data-canvas-height=\"1520\" data-document-role=\"page\" data-label=\"Packet Lab — interactive\">\n<div style=\"max-width: 1440px; margin: 0 auto; padding: 24px 32px 56px; box-sizing: border-box; display: flex; flex-direction: column; gap: 28px\">\n\n<header style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; padding-bottom: 20px; border-bottom: 1px solid #222222\">\n  <div style=\"display: flex; align-items: center; gap: 10px; flex: 0 0 auto\">\n    <span aria-hidden=\"true\" style=\"width: 10px; height: 10px; border-radius: 2px; background: #F2A541\"><\u002Fspan>\n    <span style=\"font-size: 17px; font-weight: 600; letter-spacing: -0.01em\">Packet Lab<\u002Fspan>\n  <\u002Fdiv>\n  <div style=\"flex: 1 1 560px; display: flex; flex-direction: column; gap: 10px; min-width: 0\">\n    <div style=\"display: flex; gap: 8px; flex-wrap: wrap\">\n      <div style=\"flex: 1 1 320px; display: flex; align-items: center; gap: 12px; background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 8px; padding: 0 14px; min-height: 44px; box-sizing: border-box\">\n        <label for=\"pl-url\" style=\"font-size: 12px; font-weight: 500; color: #8F8F8F\">URL<\u002Flabel>\n        <input id=\"pl-url\" type=\"text\" value=\"{{draft}}\" sc-camel-on-change=\"{{onDraft}}\" sc-camel-on-key-down=\"{{onKey}}\" style=\"flex: 1; min-width: 0; background: transparent; border: 0; color: #ECECEC; font-family: 'JetBrains Mono', monospace; font-size: 14px; padding: 11px 0; outline: none\">\n      <\u002Fdiv>\n      <button type=\"button\" sc-camel-on-click=\"{{onSend}}\" style=\"min-height: 44px; padding: 0 20px; border-radius: 8px; border: 0; background: #F2A541; color: #0A0A0A; font-weight: 600; font-size: 14px; white-space: nowrap\">{{sendLabel}}<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px\">\n      <span style=\"font-size: 12px; color: #8F8F8F\">Protocol<\u002Fspan>\n      <div role=\"group\" aria-label=\"Protocol\" style=\"display: flex; flex-wrap: wrap; background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 8px; padding: 3px; gap: 3px\">\n        <sc-for list=\"{{protoOpts}}\" as=\"p\" hint-placeholder-count=\"8\">\n          <button type=\"button\" sc-camel-on-click=\"{{p.pick}}\" aria-pressed=\"{{p.pressed}}\" style=\"display: flex; align-items: center; gap: 8px; border: 1px solid {{p.border}}; border-radius: 6px; padding: 0 10px; min-height: 34px; background: {{p.bg}}; color: {{p.fg}}; font-size: 13px; white-space: nowrap\">\n            <span>{{p.label}}<\u002Fspan>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 10px; color: {{p.tagFg}}\">{{p.t}}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div role=\"group\" aria-label=\"Direction\" style=\"display: flex; background: #0A0A0A; border: 1px solid #2A2A2A; border-radius: 8px; padding: 3px; gap: 3px; flex: 0 0 auto; align-self: flex-start\">\n    <sc-for list=\"{{dirOpts}}\" as=\"d\" hint-placeholder-count=\"2\">\n      <button type=\"button\" sc-camel-on-click=\"{{d.pick}}\" aria-pressed=\"{{d.pressed}}\" style=\"border: 0; border-radius: 6px; padding: 0 12px; min-height: 36px; font-size: 13px; background: {{d.bg}}; color: {{d.fg}}; white-space: nowrap\">{{d.label}}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start\">\n\n  <nav aria-label=\"Network layers\" style=\"flex: 1 1 270px; min-width: 0; background: #0A0A0A; border: 1px solid #222222; border-radius: 10px; overflow: hidden\">\n    <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid #222222\">\n      <span style=\"font-size: 13px; font-weight: 600\">OSI stack<\u002Fspan>\n      <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8F8F8F\">{{stackHint}}<\u002Fspan>\n    <\u002Fdiv>\n    <sc-for list=\"{{groups}}\" as=\"grp\" hint-placeholder-count=\"4\">\n      <div style=\"border-bottom: 1px solid #222222\">\n        <div style=\"display: flex; justify-content: space-between; align-items: center; padding: 10px 16px 4px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: #7A7A7A\">\n          <span>{{grp.label}}<\u002Fspan>\n          <span style=\"font-family: 'JetBrains Mono', monospace; letter-spacing: 0\">{{grp.range}}<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{grp.rows}}\" as=\"l\" hint-placeholder-count=\"2\">\n          <button type=\"button\" class=\"lrow\" sc-camel-on-click=\"{{l.pick}}\" aria-current=\"{{l.current}}\" style=\"display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 8px 16px; box-sizing: border-box; border: 0; border-top: 1px solid {{l.divider}}; background: {{l.bg}}; text-align: left\">\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: {{l.numColor}}\">{{l.n}}<\u002Fspan>\n            <span style=\"display: flex; flex-direction: column; min-width: 0\">\n              <span style=\"display: flex; align-items: center; gap: 8px\">\n                <span style=\"font-weight: 500; color: {{l.nameColor}}; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{l.name}}<\u002Fspan>\n                <sc-if value=\"{{l.live}}\" hint-placeholder-val=\"{{false}}\">\n                  <span class=\"pulse\" aria-hidden=\"true\" style=\"width: 6px; height: 6px; border-radius: 50%; background: #8FBFA0\"><\u002Fspan>\n                <\u002Fsc-if>\n              <\u002Fspan>\n              <span style=\"font-size: 12px; color: #8F8F8F; white-space: nowrap\">{{l.pdu}} · {{l.added}}<\u002Fspan>\n            <\u002Fspan>\n            <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; color: {{l.tagColor}}; border: 1px solid {{l.tagBorder}}; border-radius: 4px; padding: 2px 6px; white-space: nowrap\">{{l.proto}}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n    <div style=\"padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px\">\n      <div style=\"display: flex; justify-content: space-between; font-size: 12px\">\n        <span style=\"color: #8F8F8F\">Frame on the wire<\u002Fspan>\n        <span style=\"font-family: 'JetBrains Mono', monospace\">{{frameBytes}} B<\u002Fspan>\n      <\u002Fdiv>\n      <div aria-hidden=\"true\" style=\"display: flex; gap: 2px; height: 8px\">\n        <sc-for list=\"{{miniSegs}}\" as=\"g\" hint-placeholder-count=\"7\">\n          <span style=\"flex: {{g.grow}} 1 0px; border-radius: 2px; background: {{g.bg}}\"><\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 14px; font-size: 11px; color: #8F8F8F\">\n        <span style=\"display: flex; align-items: center; gap: 6px\"><span aria-hidden=\"true\" style=\"width: 8px; height: 8px; border-radius: 2px; background: #F2A541\"><\u002Fspan>header<\u002Fspan>\n        <span style=\"display: flex; align-items: center; gap: 6px\"><span aria-hidden=\"true\" style=\"width: 8px; height: 8px; border-radius: 2px; background: #3D5245\"><\u002Fspan>payload<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fnav>\n\n  <main style=\"flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px\">\n\n    <div style=\"display: flex; flex-direction: column; gap: 6px\">\n      <span style=\"font-size: 12px; color: #8F8F8F\">Layer {{layerNum}} · {{meta.name}}<sc-if value=\"{{playing}}\" hint-placeholder-val=\"{{false}}\"><span style=\"color: #8FBFA0\"> · {{playLabel}}<\u002Fspan><\u002Fsc-if><\u002Fspan>\n      <h1 style=\"margin: 0; font-size: 26px; font-weight: 600; letter-spacing: -0.015em; line-height: 1.2\">{{meta.title}}<\u002Fh1>\n      <p style=\"margin: 0; color: #A6A6A6; font-size: 14px\">{{meta.job}}<\u002Fp>\n    <\u002Fdiv>\n\n    <section aria-label=\"Payload\" style=\"background: #0A0A0A; border: 1px solid #222222; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 10px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap\">\n        <div style=\"display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap\">\n          <label for=\"pl-payload\" style=\"font-size: 13px; font-weight: 600\">Payload<\u002Flabel>\n          <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8F8F8F\">{{payloadInfo}}<\u002Fspan>\n          <sc-if value=\"{{isCustom}}\" hint-placeholder-val=\"{{false}}\">\n            <span style=\"font-size: 11px; color: #F2A541; border: 1px solid #5A4422; border-radius: 4px; padding: 0 6px\">edited<\u002Fspan>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n        <div style=\"display: flex; align-items: center; gap: 10px; flex-wrap: wrap\">\n          <sc-if value=\"{{isDns}}\" hint-placeholder-val=\"{{false}}\">\n            <div role=\"group\" aria-label=\"Record type\" style=\"display: flex; border: 1px solid #2A2A2A; border-radius: 6px; padding: 2px; gap: 2px\">\n              <sc-for list=\"{{dnsTypes}}\" as=\"t\" hint-placeholder-count=\"4\">\n                <button type=\"button\" sc-camel-on-click=\"{{t.pick}}\" aria-pressed=\"{{t.pressed}}\" style=\"border: 0; border-radius: 4px; padding: 0 10px; min-height: 28px; font-size: 12px; font-family: 'JetBrains Mono', monospace; background: {{t.bg}}; color: {{t.fg}}\">{{t.label}}<\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <button type=\"button\" sc-camel-on-click=\"{{onReset}}\" style=\"min-height: 32px; padding: 0 12px; border-radius: 6px; border: 1px solid #2A2A2A; background: transparent; color: {{resetFg}}; font-size: 12px\">Reset<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <textarea id=\"pl-payload\" value=\"{{payloadText}}\" sc-camel-on-change=\"{{onPayload}}\" rows=\"{{payloadRows}}\" style=\"width: 100%; box-sizing: border-box; resize: vertical; background: #050505; border: 1px solid #2A2A2A; border-radius: 6px; padding: 10px 12px; color: #ECECEC; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6; outline: none\"><\u002Ftextarea>\n      <span style=\"font-size: 12px; color: #7A7A7A\">{{payloadHint}} Type \\xNN for any byte, \\r \\n \\t for control characters. Max 600 characters.<\u002Fspan>\n    <\u002Fsection>\n\n    <section aria-label=\"On the wire\" style=\"background: #0A0A0A; border: 1px solid #222222; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 12px\">\n      <div style=\"display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap\">\n        <h2 style=\"margin: 0; font-size: 13px; font-weight: 600\">On the wire<\u002Fh2>\n        <span style=\"font-size: 12px; color: #8F8F8F; font-family: 'JetBrains Mono', monospace\">{{pduCaption}}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 3px; height: 52px\">\n        <sc-for list=\"{{segs}}\" as=\"g\" hint-placeholder-count=\"7\">\n          <button type=\"button\" class=\"seg\" sc-camel-on-click=\"{{g.pick}}\" aria-label=\"{{g.aria}}\" style=\"flex: {{g.grow}} 1 0px; min-width: {{g.minw}}px; opacity: {{g.op}}; background: {{g.bg}}; color: {{g.fg}}; border: 1px solid {{g.border}}; border-radius: 5px; padding: 0; overflow: hidden\">\n            <span style=\"display: flex; flex-direction: column; align-items: flex-start; padding: 6px 10px; white-space: nowrap; text-align: left\">\n              <span style=\"font-size: 12px; font-weight: 500\">{{g.label}}<\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.75\">{{g.bytes}} B<\u002Fspan>\n            <\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section aria-label=\"Layer detail\" style=\"background: #0A0A0A; border: 1px solid #222222; border-radius: 10px; padding: 18px; display: flex; flex-direction: column; gap: 14px\">\n\n      <sc-if value=\"{{isL7}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"display: flex; flex-direction: column; gap: 2px; overflow-x: auto\">\n          <sc-for list=\"{{fieldList}}\" as=\"f\" hint-placeholder-count=\"6\">\n            <button type=\"button\" sc-camel-on-click=\"{{f.pick}}\" style=\"display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; align-items: center; gap: 14px; text-align: left; border: 1px solid {{f.border}}; background: {{f.tint}}; border-radius: 6px; padding: 8px 12px; min-height: 40px\">\n              <span style=\"font-size: 12px; color: #8F8F8F; white-space: nowrap; overflow: hidden; text-overflow: ellipsis\">{{f.name}}<\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 13px; color: {{f.text}}; white-space: pre; overflow: hidden; text-overflow: ellipsis\">{{f.value}}<\u002Fspan>\n              <span style=\"font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #8F8F8F; white-space: nowrap\">{{f.size}}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{isL6}}\" hint-placeholder-val=\"{{false}}\">\n        <div style=\"display: flex; flex-direction: column; gap: 14px\">\n          <div style=\"display: flex; flex-wrap: wrap; gap: 6px\">\n            <sc-for list=\"{{fieldList}}\" as=\"f\" hint-placeholder-count=\"4\">\n              <button type=\"button\" sc-camel-on-click=\"{{f.pick}}\" style=\"border: 1px solid {{f.pillBorder}}; background: {{f.pillBg}}; color: {{f.pillFg}}; border-radius: 6px; padding: 0 12px; min-height: 34px; font-size: 13px\">{{f.name}}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-if value=\"{{hasChars}}\" hint-placeholder-val=\"{{true}}\">\n            <div style=\"overflow-x: auto\">\n              <div style=\"display: grid; grid-template-columns: 80px repeat({{charCount}}, minmax(44px, 1fr)); gap: 3px; min-width: 520px; font-family: 'JetBrains Mono', monospace; font-size: 12px; text-align: center\">\n                <span style=\"font-family: Inter, sans-serif; color: #8F8F8F; text-align: left; align-self: center\">Char<\u002Fspan>\n                <sc-for list=\"{{chars}}\" as=\"c\" hint-placeholder-count=\"12\"><span style=\"background: #141414; border-radius: 4px; padding: 7px 0; font-size: 14px; color: #ECECEC\">{{c.ch}}<\u002Fspan><\u002Fsc-for>\n                <span style=\"font-family: Inter, sans-serif; color: #8F8F8F; text-align: left; align-self: center\">Hex<\u002Fspan>\n                <sc-for list=\"{{chars}}\" as=\"c\" hint-placeholder-count=\"12\"><span style=\"background: #141414; border-radius: 4px; padding: 6px 0; color: #A6A6A6\">{{c.hex}}<\u002Fspan><\u002Fsc-for>\n                <span style=\"font-family: Inter, sans-serif; color: #8F8F8F; text-align: left; align-self: center\">Binary<\u002Fspan>\n                <sc-for list=\"{{chars}}\" as=\"c\" hint-placeholder-count=\"12\"><span style=\"background: #141414; border-radius: 4px; padding: 6px 0; font-size: 11px; color: #8F8F8F; line-height: 1.35; white-space: pre-line\">{{c.bin}}<\u002Fspan><\u002Fsc-for>\n                <sc-if value=\"{{hasTransform}}\" hint-placeholder-val=\"{{false}}\">\n                  <span style=\"font-family: Inter, sans-serif; color: #8F8F8F; text-align: left; align-self: center\">{{transformLabel}}<\u002Fspan>\n                  <sc-for list=\"{{chars}}\" as=\"c\" hint-placeholder-count=\"12\"><span style=\"border: 1px solid #3D5245; border-radius: 4px; padding: 5px 0; color: #8FBFA0\">{{c.e
